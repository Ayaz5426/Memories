services:
  - type: web
    name: memories-gallery
    runtime: node
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci && npm run build && test -f dist/index.js
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_URL
        value: https://memories-ayaz.onrender.com,http://localhost:5176
    disk:
      name: memories-data
      mountPath: /opt/render/project/src/server/storage
      sizeGB: 1